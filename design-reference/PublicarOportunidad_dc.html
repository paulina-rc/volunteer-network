<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"></link>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Comfortaa:wght@600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet"></link>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"></link>
  <style>
    body{ margin:0; font-family:'Poppins',sans-serif; color:#343434; background:#F8F7F4; line-height:1.6; }
    a{ text-decoration:none; color:#0F4C5C; }
    a:hover{ color:#F26B4A; }
  </style>
</helmet>

<x-import component-from-global-scope="image-slot" from="./image-slot.js" hint-size="1,1" style="position:fixed;top:-999px;left:-999px;width:1px;height:1px;overflow:hidden"></x-import>

<header style="background:rgba(248,247,244,0.97);backdrop-filter:blur(6px);position:sticky;top:0;z-index:998;border-bottom:1px solid rgba(15,76,92,0.08)">
  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1180px;margin:0 auto;gap:24px">
    <a href="Home.dc.html" style="font-family:'Comfortaa',sans-serif;font-weight:700;font-size:22px;color:#0F4C5C">Enlaza</a>
    <a href="PerfilOrganizacion.dc.html" style="font-size:14px;font-weight:500;color:#0F4C5C"><i class="fa-solid fa-arrow-left"></i> Volver a mi perfil</a>
  </div>
</header>

<section style="max-width:820px;margin:0 auto;padding:40px 24px 90px">
  <sc-if value="{{ publicado }}" hint-placeholder-val="{{ false }}">
    <div style="background:#fff;border:1px solid #EFECE3;border-radius:18px;padding:60px 40px;text-align:center">
      <i class="fa-solid fa-circle-check" style="font-size:40px;color:#0F4C5C;margin-bottom:16px"></i>
      <h1 style="font-family:'Archivo',sans-serif;font-size:22px;font-weight:700;color:#0F4C5C;margin:0 0 10px">Oportunidad publicada</h1>
      <p style="font-size:14.5px;color:#6d6d68;margin:0 0 26px">Ya está visible para las personas voluntarias en el buscador de Enlaza.</p>
      <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap">
        <a href="GestionInscripciones.dc.html" style="padding:12px 24px;border-radius:999px;background:#F26B4A;color:#fff;font-weight:600;font-size:14px">Gestionar inscripciones</a>
        <a href="PerfilOrganizacion.dc.html" style="padding:12px 24px;border-radius:999px;border:1.5px solid #0F4C5C;color:#0F4C5C;font-weight:600;font-size:14px">Ver mi perfil</a>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{ noPublicado }}" hint-placeholder-val="{{ true }}">
    <div>
      <h1 style="font-family:'Archivo',sans-serif;font-size:26px;font-weight:700;color:#0F4C5C;margin:0 0 6px">Publicar oportunidad</h1>
      <p style="font-size:14px;color:#6d6d68;margin:0 0 30px">Completá los datos para que las personas voluntarias puedan encontrar tu actividad.</p>

      <div style="background:#fff;border:1px solid #EFECE3;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Título de la oportunidad</label>
          <input type="text" placeholder="Ej. Jornada de reforestación río San Carlos" style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434"></input>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Categoría</label>
            <select style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434">
              <option>Ambiental</option>
              <option>Educativo</option>
              <option>Salud</option>
              <option>Comunitario</option>
              <option>Cultural</option>
            </select>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Cupos disponibles</label>
            <input type="number" placeholder="Ej. 20" style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434"></input>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Descripción</label>
          <textarea rows="4" placeholder="Contá de qué trata la actividad, qué se va a hacer y por qué importa." style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434;resize:vertical"></textarea>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Habilidades requeridas</label>
          <input type="text" placeholder="Ej. ninguna, o trabajo con niños, primeros auxilios..." style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434"></input>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Fecha</label>
            <input type="date" style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434"></input>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Horario</label>
            <input type="text" placeholder="Ej. 7:00 a. m. – 12:00 m." style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434"></input>
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Ubicación</label>
          <input type="text" placeholder="Ej. San Carlos, Alajuela" style="border:1.5px solid #E7E4DC;border-radius:10px;padding:12px 14px;font-family:'Poppins',sans-serif;font-size:14px;color:#343434"></input>
        </div>

        <div style="display:flex;flex-direction:column;gap:6px">
          <label style="font-size:12px;font-weight:600;color:#0F4C5C;text-transform:uppercase;letter-spacing:.04em">Foto de la actividad</label>
          <div style="height:180px"><image-slot id="publicar-foto" shape="rounded" radius="12" placeholder="arrastrá una foto real de una actividad similar" style="width:100%;height:100%"></image-slot></div>
        </div>

        <div style="display:flex;gap:14px;margin-top:10px">
          <button onClick="{{ publicar }}" style="flex:1;padding:13px;border-radius:999px;background:#F26B4A;color:#fff;font-weight:600;font-size:14.5px;border:none;cursor:pointer">Publicar oportunidad</button>
          <button style="padding:13px 24px;border-radius:999px;border:1.5px solid #0F4C5C;color:#0F4C5C;background:transparent;font-weight:600;font-size:14.5px;cursor:pointer">Guardar borrador</button>
        </div>
      </div>
    </div>
  </sc-if>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { publicado: false };
  renderVals() {
    return {
      publicado: this.state.publicado,
      noPublicado: !this.state.publicado,
      publicar: () => this.setState({ publicado: true }),
    };
  }
}
</script>
</body>
</html>
